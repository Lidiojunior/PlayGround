<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro de Clientes</title>
  <link rel="stylesheet" href="/estilo.css" />
</head>
<body>
  <main class="container">
    <h1>Cadastro de Clientes</h1>
    <h2>Crie sua conta para começar</h2>

    <section class="card">
      <form id="form-cadastro" novalidate>
        <label for="nome">Nome completo</label>
        <input id="nome" name="nome" type="text" autocomplete="name" placeholder="Seu nome completo" required />

        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="voce@exemplo.com" required />

        <label for="telefone">Telefone</label>
        <input id="telefone" name="telefone" type="tel" autocomplete="tel" placeholder="(11) 99999-9999" required />

        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" autocomplete="new-password" placeholder="Mínimo 6 caracteres" required />

        <button type="submit">Criar cadastro</button>
        <div id="aviso-cadastro" class="mensagem" role="status"></div>
      </form>
    </section>

    <section class="card">
      <h2>Já tem conta? Entrar</h2>
      <form id="form-login" novalidate>
        <label for="login-email">E-mail</label>
        <input id="login-email" name="email" type="email" autocomplete="email" required />

        <label for="login-senha">Senha</label>
        <input id="login-senha" name="senha" type="password" autocomplete="current-password" required />

        <button type="submit">Entrar</button>
        <div id="aviso-login" class="mensagem" role="status"></div>
      </form>
    </section>

    <p class="rodape">É o administrador? <a href="/clientes">Ver meus clientes</a></p>
  </main>

  <script>
    const aviso = (el, texto, tipo) => {
      el.textContent = texto;
      el.className = "mensagem " + tipo;
    };

    document.getElementById("form-cadastro").addEventListener("submit", async (evento) => {
      evento.preventDefault();
      const caixa = document.getElementById("aviso-cadastro");
      const dados = Object.fromEntries(new FormData(evento.target).entries());

      try {
        const resposta = await fetch("/api/cadastro", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(dados)
        });
        const corpo = await resposta.json();
        if (!resposta.ok) return aviso(caixa, corpo.erro || "Não foi possível cadastrar.", "erro");
        aviso(caixa, corpo.mensagem, "ok");
        evento.target.reset();
      } catch {
        aviso(caixa, "Falha de conexão com o servidor.", "erro");
      }
    });

    document.getElementById("form-login").addEventListener("submit", async (evento) => {
      evento.preventDefault();
      const caixa = document.getElementById("aviso-login");
      const dados = Object.fromEntries(new FormData(evento.target).entries());

      try {
        const resposta = await fetch("/api/login", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(dados)
        });
        const corpo = await resposta.json();
        if (!resposta.ok) return aviso(caixa, corpo.erro || "Não foi possível entrar.", "erro");
        aviso(caixa, "Bem-vindo(a), " + corpo.nome + "!", "ok");
        evento.target.reset();
      } catch {
        aviso(caixa, "Falha de conexão com o servidor.", "erro");
      }
    });
  </script>
</body>
</html>
